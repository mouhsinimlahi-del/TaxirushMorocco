name: Build TaxiRushMorocco APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q TaxiRushMorocco_Android_Project_v2.zip -d project
          mv project/Settings.gradle project/settings.gradle
          mv project/App/Build.gradle project/App/build.gradle
          mv project/App/Src project/App/src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiRushMorocco-APK
          path: project/App/build/outputs/apk/debug/*.apk
