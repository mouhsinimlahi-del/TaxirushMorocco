
name: Build TaxiRushMorocco APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf project
          mkdir project
          unzip -q TaxiRushMorocco_Android_Project_v2.zip -d project

      - name: Find project root
        run: |
          PROJECT_ROOT=$(find project -type f \( -iname 'settings.gradle' -o -iname 'settings.gradle.kts' \) -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Found project root: $PROJECT_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiRushMorocco-APK
          path: project/**/build/outputs/apk/debug/*.apk
